name: Deploy Ladder beta site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify support address
        env:
          LADDER_SUPPORT_EMAIL: ${{ secrets.LADDER_SUPPORT_EMAIL }}
          LADDER_WAITLIST_API_URL: ${{ vars.LADDER_WAITLIST_API_URL }}
          LADDER_TURNSTILE_SITE_KEY: ${{ vars.LADDER_TURNSTILE_SITE_KEY }}
        run: |
          test -n "$LADDER_SUPPORT_EMAIL" || {
            echo "Repository secret LADDER_SUPPORT_EMAIL is required."
            exit 1
          }
          test -n "$LADDER_WAITLIST_API_URL" || {
            echo "Repository variable LADDER_WAITLIST_API_URL is required."
            exit 1
          }
          test -n "$LADDER_TURNSTILE_SITE_KEY" || {
            echo "Repository variable LADDER_TURNSTILE_SITE_KEY is required."
            exit 1
          }

      - name: Build public site
        env:
          LADDER_SUPPORT_EMAIL: ${{ secrets.LADDER_SUPPORT_EMAIL }}
          LADDER_WAITLIST_API_URL: ${{ vars.LADDER_WAITLIST_API_URL }}
          LADDER_TURNSTILE_SITE_KEY: ${{ vars.LADDER_TURNSTILE_SITE_KEY }}
        run: python3 build_site.py --output /tmp/ladder-support-site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/ladder-support-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
